# This file was created on 8 Dec 2025.

# Based on...
# - https://github.com/actions/starter-workflows/blob/afb9bf31201eb5febe3b6e76b73fb1fe0b987634/ci/c-cpp.yml
# - https://github.com/actions/starter-workflows/blob/afb9bf31201eb5febe3b6e76b73fb1fe0b987634/ci/ant.yml
# - https://github.com/actions/starter-workflows/blob/afb9bf31201eb5febe3b6e76b73fb1fe0b987634/ci/python-package.yml
# - https://github.com/actions/starter-workflows/blob/afb9bf31201eb5febe3b6e76b73fb1fe0b987634/ci/go.yml
# - https://github.com/actions/starter-workflows/blob/afb9bf31201eb5febe3b6e76b73fb1fe0b987634/ci/rust.yml

name: C/C++/Java/Python/Go/Rust CI

on: push

jobs:
  build-c:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: make
    - name: Run test 1
      run: ./tictactoe_main < ../tictactoe_main___test_input_1.txt
    - name: Run test 2
      run: ./tictactoe_main < ../tictactoe_main___test_input_2.txt
    - name: Clean
      run: make clean

  build-cpp:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpp

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: make
    - name: Run test 1
      run: ./tictactoe_main < ../tictactoe_main___test_input_1.txt
    - name: Run test 2
      run: ./tictactoe_main < ../tictactoe_main___test_input_2.txt
    - name: Clean
      run: make clean

  build-java:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Build
      run: ant -noinput
    - name: Run test 1
      run: ant run < ../tictactoe_main___test_input_1.txt
    - name: Run test 2
      run: ant run < ../tictactoe_main___test_input_2.txt
    - name: Clean
      run: ant -noinput clean

  build-python:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test without pytest
      run: |
        # pytest
        python3 TicTacToe_Main.py < ../tictactoe_main___test_input_1.txt
        python3 TicTacToe_Main.py < ../tictactoe_main___test_input_2.txt

  build-go:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/${{ matrix.working-directory-for-building-go }}
    strategy:
      fail-fast: false
      matrix:
        working-directory-for-building-go: ["abc", "scan_funcs", "tictactoe"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.2'
    - name: Build
      run: go build -v ./...
    - name: Clean
      run: go clean -v ./...

  test-go:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/${{ matrix.working-directory-for-testing-go }}
    strategy:
      fail-fast: false
      matrix:
        working-directory-for-testing-go: ["scan_funcs"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.2'
    - name: Test
      run: go test -v ./...

  run-go:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/${{ matrix.working-directory-for-running-go }}
    strategy:
      fail-fast: false
      matrix:
        working-directory-for-running-go: ["abc", "tictactoe"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.2'
    - name: Run test 1
      run: go run -v ./... < ../../tictactoe_main___test_input_1.txt
    - name: Run test 2
      run: go run -v ./... < ../../tictactoe_main___test_input_2.txt

  build-rust:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        what-to-do-right-before-cleaning-rust: ["build", "check", "doc", "test", "run --bin abc",
          "run --bin tictactoe_main < ../tictactoe_main___test_input_1.txt",
          "run --bin tictactoe_main < ../tictactoe_main___test_input_2.txt"]
    env:
      CARGO_TERM_COLOR: always

    steps:
    - uses: actions/checkout@v4
    - name: ${{ matrix.what-to-do-right-before-cleaning-rust }}
      run: cargo ${{ matrix.what-to-do-right-before-cleaning-rust }} --verbose
    - name: Clean
      run: cargo clean --verbose
